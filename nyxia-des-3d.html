<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NyXia — Dés 3D</title>
  <link rel="icon" type="image/png" href="/images/FavIcon.png">
  <link rel="stylesheet" href="/css/nyxia-des-3d.css">
</head>
<body>
  <canvas id="starry-canvas" aria-hidden="true"></canvas>
  <main id="app">
    <header class="heading"><h1>✦ NyXia — Dés 3D ✦</h1><p>Sélectionne les dés et lance-les.</p></header>
    <div class="stage"><canvas id="canvas3d" role="img" aria-label="Animation des dés en trois dimensions"></canvas><span class="stage-note" id="stage-note">Choisis un dé ci-dessous</span></div>
    <div id="result" role="status" aria-live="polite" aria-atomic="true">Choisis tes dés et lance !</div>
    <div id="detail" aria-live="polite"></div>
    <div id="selector" aria-label="Choix des dés"></div>
    <div id="mod-row"><label for="modifier">Modificateur :</label><input type="number" id="modifier" value="0" min="-999" max="999" step="1"></div>
    <div id="actions"><button class="btn" type="button" id="clear">Effacer</button><button class="btn primary" type="button" id="roll">✦ Lancer</button><button class="btn" type="button" id="reset">Réinitialiser</button></div>
    <div class="hist-title">Historique des lancers</div><div id="hist" aria-live="polite"></div>
  </main>
  <script src="/js/starry-bg.js" defer></script>
  <script src="/js/nyxia-des-3d.js" defer></script>
</body>
</html>
