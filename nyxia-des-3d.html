<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyXia — Dés 3D</title>
<link rel="icon" type="image/png" href="/images/FavIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--p:#7B5CFF;--p2:#5A6CFF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--bg1:#0A1628;--bg2:#0F1C3F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:'Outfit',sans-serif;color:var(--t2)}
#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:18px;padding:16px}
h1{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--t);letter-spacing:2px;text-align:center}
#canvas3d{display:block;border-radius:16px;border:1px solid rgba(123,92,255,0.25);background:transparent}
#result{font-size:24px;font-weight:700;color:var(--gold);letter-spacing:2px;text-align:center;min-height:36px;text-shadow:0 0 20px rgba(244,200,66,0.5)}
#detail{font-size:13px;color:var(--t3);text-align:center;min-height:18px}
#selector{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.die-btn{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.die-face{width:58px;height:58px;border:1.5px solid rgba(123,92,255,0.4);border-radius:10px;background:rgba(123,92,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--t2);position:relative;transition:all .15s;user-select:none}
.die-face:hover{border-color:var(--p);background:rgba(123,92,255,0.2);color:#fff}
.die-count{display:flex;align-items:center;gap:4px;background:rgba(123,92,255,0.12);border:1px solid rgba(123,92,255,0.25);border-radius:6px;padding:2px 6px;font-size:12px}
.die-count button{background:none;border:none;color:var(--p);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.die-count span{min-width:16px;text-align:center;font-weight:600;color:var(--t)}
.die-name{font-size:11px;color:var(--t3)}
#mod-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t3)}
#mod-row input{width:55px;background:var(--bg2);border:1px solid rgba(123,92,255,0.3);border-radius:6px;color:var(--t);font-family:'Outfit',sans-serif;font-size:14px;text-align:center;padding:5px;outline:none}
#actions{display:flex;gap:10px}
.btn{padding:10px 24px;border-radius:50px;border:1px solid rgba(123,92,255,0.4);background:rgba(123,92,255,0.12);color:var(--t2);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(123,92,255,0.28);color:#fff;border-color:var(--p)}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent;color:#fff}
.btn.primary:hover{opacity:.9}
#hist{display:flex;flex-direction:column;gap:3px;max-height:80px;overflow-y:auto;width:100%;max-width:460px}
.hist-row{display:flex;justify-content:space-between;background:rgba(15,28,63,0.5);border:1px solid rgba(123,92,255,0.1);border-radius:6px;padding:4px 10px;font-size:12px}
.hist-total{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div id="app">
  <h1>✦ NyXia — Dés 3D ✦</h1>
  <canvas id="canvas3d" width="380" height="220"></canvas>
  <div id="result">Choisis tes dés et lance !</div>
  <div id="detail"></div>
  <div id="selector"></div>
  <div id="mod-row">
    <span>Modificateur :</span>
    <input type="number" id="modifier" value="0" min="-20" max="20" step="1">
  </div>
  <div id="actions">
    <button class="btn" onclick="clearDice()">Effacer</button>
    <button class="btn primary" onclick="rollAll()">✦ Lancer</button>
    <button class="btn" onclick="resetAll()">Reset</button>
  </div>
  <div id="hist"></div>
</div>

<script src="/js/starry-bg.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DICE = [
  {key:'d4', label:'D4', sides:4},
  {key:'d6', label:'D6', sides:6},
  {key:'d8', label:'D8', sides:8},
  {key:'d10', label:'D10', sides:10},
  {key:'d12', label:'D12', sides:12},
  {key:'d20', label:'D20', sides:20},
];
const counts = {};
DICE.forEach(d => counts[d.key] = 0);

// Build selector
const sel = document.getElementById('selector');
DICE.forEach(die => {
  const wrap = document.createElement('div');
  wrap.className = 'die-btn';
  wrap.innerHTML = `
    <div class="die-face" onclick="change('${die.key}',1)">${die.label}</div>
    <div class="die-count">
      <button onclick="change('${die.key}',-1)">−</button>
      <span id="cnt-${die.key}">0</span>
      <button onclick="change('${die.key}',1)">+</button>
    </div>
    <div class="die-name">${die.label}</div>`;
  sel.appendChild(wrap);
});

function change(key, delta) {
  counts[key] = Math.max(0, Math.min(10, counts[key] + delta));
  document.getElementById('cnt-' + key).textContent = counts[key];
}

// Three.js scene
const cvs = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({canvas: cvs, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(380, 220);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 380/220, 0.1, 100);
camera.position.set(0, 0, 8);

scene.add(new THREE.AmbientLight(0x8866ff, 2));
const pl1 = new THREE.PointLight(0xaa66ff, 3, 20); pl1.position.set(4,5,6); scene.add(pl1);
const pl2 = new THREE.PointLight(0x4455dd, 2, 15); pl2.position.set(-4,-3,4); scene.add(pl2);

// Particles
const pg = new THREE.BufferGeometry();
const pp = new Float32Array(120*3);
for(let i=0;i<120;i++){pp[i*3]=(Math.random()-.5)*18;pp[i*3+1]=(Math.random()-.5)*12;pp[i*3+2]=(Math.random()-.5)*8-2;}
pg.setAttribute('position', new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({color:0xaa88ff,size:0.06,transparent:true,opacity:0.5})));

// Build D20 with numbered faces
function makeFaceTex(num) {
  const tc = document.createElement('canvas'); tc.width=256; tc.height=256;
  const ctx = tc.getContext('2d');
  ctx.fillStyle='#0f0030'; ctx.fillRect(0,0,256,256);
  const cx=128,cy=128,r=108;
  ctx.beginPath();
  for(let k=0;k<3;k++){
    const a=-Math.PI/2+k*2*Math.PI/3;
    k===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath();
  ctx.strokeStyle='#9944ee'; ctx.lineWidth=4; ctx.stroke();
  ctx.fillStyle='rgba(100,40,200,0.1)'; ctx.fill();
  const fs=num>9?90:106;
  ctx.font=`900 ${fs}px Arial Black,Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffffff';
  ctx.fillText(String(num),cx,cy+5);
  return new THREE.CanvasTexture(tc);
}

function makeD20(px) {
  const geo = new THREE.IcosahedronGeometry(1.3,0);
  const mats = [];
  for(let i=0;i<20;i++) mats.push(new THREE.MeshStandardMaterial({map:makeFaceTex(i+1),roughness:0.25,metalness:0.5}));
  const ig = new THREE.IcosahedronGeometry(1.3,0);
  ig.clearGroups();
  for(let i=0;i<20;i++) ig.addGroup(i*3,3,i);
  const mesh = new THREE.Mesh(ig,mats);
  mesh.position.x = px;
  const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.32,0), new THREE.MeshBasicMaterial({color:0x8833cc,wireframe:true,transparent:true,opacity:0.2}));
  mesh.add(wire);
  scene.add(mesh);
  return mesh;
}

const d1 = makeD20(-2);
const d2 = makeD20(2);

const diceState = [
  {mesh:d1, spinning:false, vx:0,vy:0, val:null, t:0, tot:0},
  {mesh:d2, spinning:false, vx:0,vy:0, val:null, t:0, tot:0},
];

function rollDie(idx, cb) {
  const d = diceState[idx];
  d.val = Math.ceil(Math.random()*20);
  d.spinning = true; d.t = 0;
  d.tot = 1.4 + Math.random()*0.7;
  d.vx = (Math.random()-.5)*0.8+0.3;
  d.vy = (Math.random()-.5)*0.8+0.4;
  if(cb) setTimeout(()=>cb(d.val), d.tot*1000+100);
}

let lt=0;
function animate(ts){
  requestAnimationFrame(animate);
  const dt=Math.min((ts-lt)/1000,.05); lt=ts;
  const now=Date.now()/1000;
  diceState.forEach((d,i)=>{
    if(d.spinning){
      d.t+=dt;
      const ease=Math.max(0,1-Math.pow(d.t/d.tot,2.5));
      d.mesh.rotation.x+=d.vx*(ease*10+.3)*dt*3;
      d.mesh.rotation.y+=d.vy*(ease*10+.3)*dt*3;
      if(d.t>=d.tot) d.spinning=false;
    } else {
      d.mesh.rotation.x+=.003*(i?-1:1);
      d.mesh.rotation.y+=.006;
      d.mesh.position.y=Math.sin(now*.8+i*Math.PI)*.1;
    }
  });
  pg.parent && (pg.parent.rotation.y+=.0007);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

// Roll logic
let v1=null,v2=null,rolling=false;
const resultEl=document.getElementById('result');
const detailEl=document.getElementById('detail');

function rollAll() {
  const notation = DICE.filter(d=>counts[d.key]>0).map(d=>`${counts[d.key]}${d.label}`).join(' + ');
  if(!notation){resultEl.textContent='Sélectionne au moins un dé !';return;}
  if(rolling) return;
  rolling=true; v1=null; v2=null;
  resultEl.textContent='⟳ Lancement…'; detailEl.textContent=notation;

  // Calcul local du résultat
  let total=0, parts=[];
  DICE.forEach(die=>{
    for(let i=0;i<counts[die.key];i++){
      const r=Math.ceil(Math.random()*die.sides);
      total+=r; parts.push(`${die.label}:${r}`);
    }
  });
  const mod=parseInt(document.getElementById('modifier').value)||0;
  const grand=total+mod;
  const modStr=mod!==0?(mod>0?` + ${mod}`:` − ${Math.abs(mod)}`):'' ;

  // Animer les deux D20 visuels
  rollDie(0, ()=>{
    rollDie(1, ()=>{
      rolling=false;
      resultEl.textContent=`Total : ${grand}${grand>=grand&&mod!==0?` (${total}${modStr})`:''}`;
      detailEl.textContent=parts.join('  ·  ');
      addHist(grand, parts.join(', '), mod);
    });
  });
}

function clearDice(){resultEl.textContent='Choisis tes dés et lance !';detailEl.textContent='';}
function resetAll(){
  DICE.forEach(d=>{counts[d.key]=0;document.getElementById('cnt-'+d.key).textContent='0';});
  document.getElementById('modifier').value=0;
  clearDice();
  document.getElementById('hist').innerHTML='';
}

const histEl=document.getElementById('hist');
function addHist(total,detail,mod){
  const modStr=mod!==0?(mod>0?` +${mod}`:` ${mod}`):'';
  const row=document.createElement('div'); row.className='hist-row';
  row.innerHTML=`<span>${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} — ${detail}${modStr}</span><span class="hist-total">${total}</span>`;
  histEl.prepend(row);
  while(histEl.children.length>8) histEl.removeChild(histEl.lastChild);
}
</script>
</body>
</html>
