<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyXia — Dés 3D</title>
<link rel="icon" type="image/png" href="/images/FavIcon.png">
<style>
:root{--p:#7B5CFF;--p2:#5A6CFF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--bg1:#0A1628;--bg2:#0F1C3F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg1);font-family:'Outfit',Georgia,sans-serif;color:var(--t2);overflow:hidden}
canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
h1{font-size:20px;color:var(--t);letter-spacing:3px;text-align:center}

/* Zone des dés */
#dice-zone{display:flex;gap:40px;align-items:center;justify-content:center;perspective:600px;height:140px}

/* Dé CSS 3D */
.die-wrap{width:90px;height:90px;perspective:400px;cursor:pointer}
.die{width:90px;height:90px;position:relative;transform-style:preserve-3d;transition:transform 0.05s linear}
.die.rolling{transition:none}
.face{position:absolute;width:90px;height:90px;border:2px solid rgba(123,92,255,0.6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(123,92,255,0.8);font-family:Arial Black,Arial,sans-serif;user-select:none}
.f1{background:rgba(30,10,80,0.92);transform:translateZ(45px)}
.f2{background:rgba(25,8,70,0.92);transform:rotateY(180deg) translateZ(45px)}
.f3{background:rgba(20,6,65,0.92);transform:rotateY(90deg) translateZ(45px)}
.f4{background:rgba(28,9,75,0.92);transform:rotateY(-90deg) translateZ(45px)}
.f5{background:rgba(22,7,68,0.92);transform:rotateX(90deg) translateZ(45px)}
.f6{background:rgba(26,8,72,0.92);transform:rotateX(-90deg) translateZ(45px)}

/* Résultat */
#result{font-size:26px;font-weight:700;color:var(--gold);letter-spacing:2px;text-align:center;min-height:38px}
#detail{font-size:12px;color:var(--t3);text-align:center;min-height:18px}

/* Sélecteur */
#selector{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.die-btn{display:flex;flex-direction:column;align-items:center;gap:4px}
.die-icon{width:52px;height:52px;border:1.5px solid rgba(123,92,255,0.4);border-radius:10px;background:rgba(123,92,255,0.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer;transition:all .15s}
.die-icon:hover{border-color:var(--p);background:rgba(123,92,255,0.22);color:#fff}
.cnt-row{display:flex;align-items:center;gap:3px;background:rgba(123,92,255,0.1);border:1px solid rgba(123,92,255,0.2);border-radius:6px;padding:2px 5px}
.cnt-row button{background:none;border:none;color:var(--p);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.cnt-row span{min-width:14px;text-align:center;font-weight:700;color:var(--t);font-size:13px}
.die-lbl{font-size:10px;color:var(--t3)}

/* Mod */
#mod-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}
#mod-row input{width:52px;background:var(--bg2);border:1px solid rgba(123,92,255,0.3);border-radius:6px;color:var(--t);font-size:14px;text-align:center;padding:4px;outline:none}

/* Actions */
#actions{display:flex;gap:8px}
.btn{padding:9px 20px;border-radius:50px;border:1px solid rgba(123,92,255,0.4);background:rgba(123,92,255,0.1);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(123,92,255,0.25);color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent;color:#fff}

/* Historique */
#hist{display:flex;flex-direction:column;gap:3px;width:100%;max-width:420px;max-height:72px;overflow-y:auto}
.hrow{display:flex;justify-content:space-between;background:rgba(15,28,63,0.5);border:1px solid rgba(123,92,255,0.1);border-radius:6px;padding:3px 10px;font-size:11px}
.htot{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <h1>✦ NyXia — Dés 3D ✦</h1>

  <div id="dice-zone">
    <div class="die-wrap" onclick="quickRoll(0)">
      <div class="die" id="die0">
        <div class="face f1" id="d0f1">1</div>
        <div class="face f2" id="d0f2">6</div>
        <div class="face f3" id="d0f3">2</div>
        <div class="face f4" id="d0f4">5</div>
        <div class="face f5" id="d0f5">3</div>
        <div class="face f6" id="d0f6">4</div>
      </div>
    </div>
    <div class="die-wrap" onclick="quickRoll(1)">
      <div class="die" id="die1">
        <div class="face f1" id="d1f1">1</div>
        <div class="face f2" id="d1f2">6</div>
        <div class="face f3" id="d1f3">2</div>
        <div class="face f4" id="d1f4">5</div>
        <div class="face f5" id="d1f5">3</div>
        <div class="face f6" id="d1f6">4</div>
      </div>
    </div>
  </div>

  <div id="result">Choisis tes dés et lance !</div>
  <div id="detail"></div>

  <div id="selector"></div>

  <div id="mod-row">
    <span>Modificateur :</span>
    <input type="number" id="modifier" value="0" min="-20" max="20" step="1">
  </div>
  <div id="actions">
    <button class="btn" onclick="clearAll()">Effacer</button>
    <button class="btn primary" onclick="rollAll()">✦ Lancer</button>
    <button class="btn" onclick="resetAll()">Reset</button>
  </div>
  <div id="hist"></div>
</div>

<script>
// ── Fond étoilé ──────────────────────────────────────────────
(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d'),st=[],sh=[];
  function rsz(){c.width=innerWidth;c.height=innerHeight;}
  function mk(){st=[];for(var i=0;i<320;i++)st.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+0.2,o:Math.random()*0.7+0.2,ts:Math.random()*0.02+0.004,ph:Math.random()*Math.PI*2});}
  function shoot(){sh.push({x:Math.random()*c.width*0.7,y:Math.random()*c.height*0.3,len:Math.random()*80+40,sp:Math.random()*7+4,ang:Math.PI/4+(Math.random()-0.5)*0.3,life:1});}
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<st.length;i++){var s=st[i],f=Math.sin(t*0.001*s.ts+s.ph)*0.3+0.7;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(s.o*f).toFixed(2)+')';ctx.fill();}
    for(var i=sh.length-1;i>=0;i--){var s=sh[i],tx=s.x-Math.cos(s.ang)*s.len,ty=s.y-Math.sin(s.ang)*s.len,g=ctx.createLinearGradient(tx,ty,s.x,s.y);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,'+s.life.toFixed(2)+')');ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();s.x+=Math.cos(s.ang)*s.sp;s.y+=Math.sin(s.ang)*s.sp;s.life-=0.016;if(s.life<=0)sh.splice(i,1);}
    requestAnimationFrame(draw);
  }
  rsz();mk();requestAnimationFrame(draw);
  setInterval(shoot,3000);
  window.addEventListener('resize',function(){rsz();mk();});
})();

// ── Dés CSS 3D ───────────────────────────────────────────────
const DICE=[
  {key:'d4',label:'D4',sides:4},
  {key:'d6',label:'D6',sides:6},
  {key:'d8',label:'D8',sides:8},
  {key:'d10',label:'D10',sides:10},
  {key:'d12',label:'D12',sides:12},
  {key:'d20',label:'D20',sides:20},
];
const counts={};
DICE.forEach(d=>counts[d.key]=0);

// Sélecteur
const selEl=document.getElementById('selector');
DICE.forEach(die=>{
  const w=document.createElement('div');w.className='die-btn';
  w.innerHTML=`<div class="die-icon" onclick="change('${die.key}',1)">${die.label}</div>
    <div class="cnt-row">
      <button onclick="change('${die.key}',-1)">−</button>
      <span id="cnt-${die.key}">0</span>
      <button onclick="change('${die.key}',1)">+</button>
    </div>
    <div class="die-lbl">${die.label}</div>`;
  selEl.appendChild(w);
});
function change(key,d){counts[key]=Math.max(0,Math.min(10,counts[key]+d));document.getElementById('cnt-'+key).textContent=counts[key];}

// Animation rotation
const rotX=[0,0],rotY=[0,0],vX=[0,0],vY=[0,0];
let spinning=[false,false];
let lastTs=0;

function animate(ts){
  requestAnimationFrame(animate);
  const dt=Math.min((ts-lastTs)/1000,0.05);lastTs=ts;
  for(let i=0;i<2;i++){
    if(spinning[i]){
      rotX[i]+=vX[i]*dt*360;
      rotY[i]+=vY[i]*dt*360;
      vX[i]*=0.97;vY[i]*=0.97;
      if(Math.abs(vX[i])<0.5&&Math.abs(vY[i])<0.5){
        spinning[i]=false;
        if(doneCallbacks[i]){doneCallbacks[i]();doneCallbacks[i]=null;}
      }
    } else {
      rotX[i]+=8*dt*(i?-1:1);
      rotY[i]+=12*dt;
    }
    document.getElementById('die'+i).style.transform=`rotateX(${rotX[i]}deg) rotateY(${rotY[i]}deg)`;
  }
}
requestAnimationFrame(animate);

const doneCallbacks=[null,null];

function spinDie(idx,sides,cb){
  const val=Math.ceil(Math.random()*sides);
  // Mettre le résultat sur toutes les faces pour que peu importe la rotation, un chiffre est visible
  for(let f=1;f<=6;f++){
    const el=document.getElementById('d'+idx+'f'+f);
    if(el) el.textContent=val;
  }
  spinning[idx]=true;
  vX[idx]=(Math.random()-.5)*18+8;
  vY[idx]=(Math.random()-.5)*18+10;
  doneCallbacks[idx]=cb;
  return val;
}

function quickRoll(idx){
  // Détermine le type de dé actif ou D6 par défaut
  const active=DICE.find(d=>counts[d.key]>0)||{sides:6};
  spinDie(idx,active.sides,null);
}

// ── Logique principale ────────────────────────────────────────
const resultEl=document.getElementById('result');
const detailEl=document.getElementById('detail');
let rolling=false;

function rollAll(){
  const active=DICE.filter(d=>counts[d.key]>0);
  if(!active.length){resultEl.textContent='Sélectionne au moins un dé !';return;}
  if(rolling)return;
  rolling=true;
  resultEl.textContent='⟳ Lancement…';

  let total=0,parts=[];
  active.forEach(die=>{
    for(let i=0;i<counts[die.key];i++){
      const r=Math.ceil(Math.random()*die.sides);
      total+=r;parts.push(`${die.label}:${r}`);
    }
  });
  const mod=parseInt(document.getElementById('modifier').value)||0;
  const grand=total+mod;
  const modStr=mod!==0?(mod>0?` + ${mod}`:` − ${Math.abs(mod)}`):'' ;

  // Animer les deux dés visuels avec le résultat total sur les faces
  const lastDie=active[active.length-1];
  spinDie(0,lastDie.sides,()=>{
    spinDie(1,lastDie.sides,()=>{
      rolling=false;
      resultEl.textContent=`Total : ${grand}${mod!==0?` (${total}${modStr})`:''}`;
      detailEl.textContent=parts.join('  ·  ');
      addHist(grand,parts.join(', '),mod);
    });
  });
}

function clearAll(){resultEl.textContent='Choisis tes dés et lance !';detailEl.textContent='';}
function resetAll(){
  DICE.forEach(d=>{counts[d.key]=0;document.getElementById('cnt-'+d.key).textContent='0';});
  document.getElementById('modifier').value=0;clearAll();
  document.getElementById('hist').innerHTML='';
}

const histEl=document.getElementById('hist');
function addHist(total,detail,mod){
  const ms=mod!==0?(mod>0?` +${mod}`:` ${mod}`):'';
  const r=document.createElement('div');r.className='hrow';
  r.innerHTML=`<span>${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} — ${detail}${ms}</span><span class="htot">${total}</span>`;
  histEl.prepend(r);
  while(histEl.children.length>8)histEl.removeChild(histEl.lastChild);
}
</script>
</body>
</html>
