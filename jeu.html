<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia Game | Le jeu</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg1:#0A1628;--p:#7B5CFF;--p2:#5A6CFF;--gold:#F4C842;--t:#FFF;--t2:#D6D9F0}*{box-sizing:border-box}body{background:var(--bg1);color:var(--t2);font:16px Outfit,sans-serif;margin:0;min-height:100vh}#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}main{position:relative;z-index:1;max-width:1020px;margin:auto;padding:20px 22px 75px}header{display:flex;gap:16px;align-items:center;justify-content:space-between}h1,h2{font-family:'Cormorant Garamond',serif;color:#fff}h1{font-size:26px}h2{font-size:clamp(30px,5vw,54px);margin:20px 0}#story{white-space:pre-wrap;line-height:1.8;font-size:clamp(16px,2.1vw,21px)}#media img,#media video{display:block;max-width:100%;max-height:58vh;object-fit:contain;margin:20px auto;border-radius:14px}#media audio{display:block;width:min(100%,550px);margin:15px auto}button{border:1px solid rgba(123,92,255,.5);padding:10px 16px;background:rgba(123,92,255,.2);color:white;border-radius:11px;font:600 14px Outfit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:30px}.breakout{background:rgba(244,200,66,.12);border:1px solid rgba(244,200,66,.4);border-radius:13px;padding:16px;margin:20px 0;color:#fff}small{color:var(--gold)}#title{font-size:14px;color:var(--gold)}</style></head><body><canvas id="starry-canvas"></canvas><main><header><h1>NyXia Game</h1><small id="counter"></small></header><p id="title">Le jeu</p><h2 id="scene-title">Nom du jeu à venir</h2><div id="media"></div><p id="story">Ton aventure apparaîtra ici.</p><div id="breakout"></div><div class="actions"><button id="previous" disabled>← Précédent</button><button id="next" disabled>Suivant →</button></div></main><script src="/starry-bg.js" defer></script><script>let scenes=[],index=0;const $=s=>document.getElementById(s);function render(){const s=scenes[index];if(!s)return; $('scene-title').textContent=s.title||'Scène';$('title').textContent=s.phase||'';$('counter').textContent=(index+1)+' / '+scenes.length;$('story').textContent=[s.readAloud,s.announcement,s.playerObjective].filter(Boolean).join('\n\n');$('media').replaceChildren();for(const [key,tag] of [['imageUrl','img'],['videoUrl','video'],['audioUrl','audio']]){const raw=s.media&&s.media[key];if(!raw)continue;try{const u=new URL(raw,location.href);if(!['https:','http:'].includes(u.protocol))continue;const el=document.createElement(tag);el.src=u.href;if(tag!=='img'){el.controls=true;el.preload='metadata';}else el.alt=s.title||'Image du jeu';$('media').appendChild(el);}catch(_){}}$('breakout').replaceChildren();if(s.breakout&&s.breakout.enabled){const d=document.createElement('div');d.className='breakout';d.textContent='Salles de sous-groupes : '+(s.breakout.instruction||'Suivez les indications du maître de jeu.');$('breakout').appendChild(d);} $('previous').disabled=index===0;$('next').disabled=index>=scenes.length-1;}fetch('/api/game/slides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('nyxia_token')||''})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Accès indisponible');return d}).then(d=>{$('title').textContent=d.title||'Le jeu';scenes=Array.isArray(d.scenes)?d.scenes:[];if(scenes.length)render();else $('story').textContent='Les scènes de ce jeu ne sont pas encore disponibles.';}).catch(e=>{$('story').textContent=e.message});$('previous').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<scenes.length-1){index++;render()}};</script></body></html>
