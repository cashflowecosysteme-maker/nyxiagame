<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1628"><title>NyXia Game | Connexion</title>
<link rel="icon" type="image/png" href="/images/FavIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/game-portal.css"><script src="/js/starry-bg.js" defer></script>
</head>
<body>
<canvas id="starry-canvas" aria-hidden="true"></canvas><div class="aura" aria-hidden="true"></div>
<main class="login-wrap"><div class="panel">
<img src="/images/NyXia.png" alt="NyXia"><p class="eyebrow" style="text-align:center;margin-top:15px">Portail individuel de jeu</p>
<h1 id="login-title">Connexion NyXia Game</h1>
<p class="muted" style="text-align:center;margin-bottom:24px">Connecte-toi pour accéder à ton jeu. Son achat sera vérifié séparément.</p>
<form id="login-form">
<label class="field">Ton prénom (facultatif)<input id="firstname" autocomplete="given-name" placeholder="Ton prénom"></label>
<label class="field">Adresse courriel<input id="email" type="email" autocomplete="email" required></label>
<label class="field">Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
<button class="btn primary" type="submit" id="submit">Se connecter</button>
<p id="login-error" class="muted" role="alert"></p>
</form>
<p class="tiny muted" style="margin-top:25px;text-align:center"><a href="/">← Retour à l'accueil du jeu</a></p>
</div></main>
<script>
(async()=>{
 const token=sessionStorage.getItem('nyxia_token');
 if(token)try{const r=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),credentials:'same-origin'});const d=await r.json();if(r.ok&&d.valid===true){location.replace('/dashbord.html');return}}catch{}
 try{const r=await fetch('/game-manifest.json',{cache:'no-store'});if(r.ok){const m=await r.json();if(m.title&&m.gameId)document.getElementById('login-title').textContent='NyXia Game | '+m.title}}catch{}
})();
document.getElementById('login-form').addEventListener('submit',async e=>{
 e.preventDefault();const btn=document.getElementById('submit'),message=document.getElementById('login-error');btn.disabled=true;message.textContent='Vérification en cours…';
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,firstname=document.getElementById('firstname').value.trim();
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok||d.success!==true||typeof d.token!=='string'||!d.token)throw Error(d.error||'Identifiants non reconnus.');
  sessionStorage.setItem('nyxia_token',d.token);
  if(firstname||d.firstname)localStorage.setItem('nyxia_username',firstname||d.firstname);
  location.assign('/dashbord.html');
 }catch(err){message.textContent='Connexion impossible : '+err.message;btn.disabled=false}
});
</script>
</body></html>
